name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    env:
      SOLUTION_FILE_PATH: src/Shell.sln
      BUILD_CONFIGURATION: release
      BUILD_PLATFORM: x64
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      uses: NuGet/setup-nuget@v2

    - name: Restore native packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}} -NonInteractive

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m '/t:dll;exe' /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} ${{env.SOLUTION_FILE_PATH}}

    - name: Build and run selection and toolbar tests
      shell: pwsh
      run: |
        msbuild .\src\tests\SelectionTests.vcxproj /p:Configuration=release /p:Platform=x64
        if ($LASTEXITCODE -ne 0) { throw "Selection test build failed" }
        & .\src\tests\bin\selection-tests.exe
        if ($LASTEXITCODE -ne 0) { throw "Selection tests failed" }

    - name: Validate portable package
      shell: pwsh
      run: |
        foreach ($path in @(
          '.\src\bin\shell.dll',
          '.\src\bin\shell.exe',
          '.\src\bin\shell.nss',
          '.\src\bin\imports\taskbar.nss',
          '.\src\bin\imports\lang\en.nss'
        )) {
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Missing package file: $path"
          }
        }
        Copy-Item -LiteralPath .\LICENSE -Destination .\src\bin\LICENSE

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyShell-x64
        path: |
          src/bin/**
          !src/bin/*.lib
          !src/bin/*.exp
          !src/bin/*.pdb
          !src/bin/*.pgd
          !src/bin/*.wixpdb
          !src/bin/ca.dll
        if-no-files-found: error
        retention-days: 0
        compression-level: 6
        overwrite: false
        include-hidden-files: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
    - name: Download tested portable package
      uses: actions/download-artifact@v4
      with:
        name: MyShell-x64
        path: package

    - name: Create release ZIP
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        $archive = "MyShell-$env:RELEASE_TAG-x64.zip"
        Compress-Archive -Path .\package\* -DestinationPath $archive
        $entries = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $archive))
        try {
          foreach ($required in @('shell.dll', 'shell.exe', 'shell.nss', 'LICENSE')) {
            if (!$entries.GetEntry($required)) {
              throw "Missing release ZIP entry: $required"
            }
          }
        } finally {
          $entries.Dispose()
        }

    - name: Publish pre-release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        gh release create "$env:RELEASE_TAG" "MyShell-$env:RELEASE_TAG-x64.zip" `
          --verify-tag --title "MyShell $env:RELEASE_TAG" --prerelease `
          --notes "Windows x64 portable build. Includes shell.dll, shell.exe, starter NSS configuration, and license. Built and tested by GitHub Actions. Back up your active configuration before updating; see the README for installation and toolbar settings."
        if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
